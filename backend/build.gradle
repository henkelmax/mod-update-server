plugins {
    id 'org.springframework.boot' version "${springboot_version}"
    id 'io.spring.dependency-management' version "${spring_dependency_management_version}"
    id 'java'
}

group = 'de.maxhenkel'
version = project_version

base {
    archivesName = 'modupdateserver'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

bootRun {
    environment 'spring_profiles_active', 'dev'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-h2console'

    implementation "io.micrometer:micrometer-registry-prometheus:${micrometer_version}"

    runtimeOnly "org.aspectj:aspectjrt:${aspectjrt_version}"
    implementation "org.aspectj:aspectjtools:${aspectjrt_version}"

    implementation "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"

    runtimeOnly "org.postgresql:postgresql:${postgresql_version}"
    runtimeOnly "com.h2database:h2:${h2_version}"
    implementation "org.modelmapper:modelmapper:${modelmapper_version}"
    implementation "io.hypersistence:hypersistence-utils-hibernate-73:${hypersistence_version}"


    implementation 'org.springframework:spring-context'
    implementation "com.google.guava:guava:${guava_version}"
    implementation 'org.hibernate.validator:hibernate-validator'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junit_version}"
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach { enabled = false }

tasks {
    bootJar {
        archiveFileName.set('app.jar')
    }
}
