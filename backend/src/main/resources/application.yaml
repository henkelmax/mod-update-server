management:
  server:
    port: 8070
  endpoints:
    web:
      exposure:
        include: [ "prometheus" ]

spring:
  web:
    error:
      path: /error
      whitelabel:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    driverClassName: org.postgresql.Driver
  profiles:
    active: prod